name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject cache-busting version into service worker
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          sed -i "s/portfolio-tracker-v1/portfolio-tracker-${SHORT_SHA}/" service-worker.js
          echo "CACHE_NAME is now:"
          grep CACHE_NAME service-worker.js

      - name: Exclude worker/ from the Pages deploy
        # worker/ is source for a separate Cloudflare Worker deployment
        # (see worker/README.md and deploy-worker.yml) — it stays
        # committed to the repo for version control, but doesn't belong
        # in the published static site. upload-pages-artifact has no
        # exclude option, so the actual fix is removing it from this
        # job's checked-out copy before the upload step runs — this
        # only affects this workflow run's temporary workspace, not
        # the repo itself.
        run: rm -rf worker

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
